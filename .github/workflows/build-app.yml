name: Build app

# Builds an app in apps/ (the playground) for Linux, Windows, macOS, Android
# and the web. Called by release.yml for an app's `<app>-v*` tag; can also be
# run by hand (Actions → Build app) to try the builds without releasing.
# Each target is uploaded as a workflow artifact named <app>-<target>.
#
# The web build is the same as pages.yml's (Wasm -O4 with the fit workers),
# zipped with base href `/` for self-hosting; Pages itself is deployed from
# main by pages.yml.

on:
  workflow_call:
    inputs:
      app:
        description: "The app to build: a folder of apps/"
        required: true
        type: string
      version:
        description: "Version string used in the artifact file names"
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      app:
        description: "The app to build"
        required: true
        type: choice
        options:
          - hgf_playground
      version:
        description: "Version string used in the artifact file names"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: android, os: ubuntu-latest }
          - { target: web, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ inputs.app }}
      NAME: ${{ inputs.app }}-${{ inputs.version }}-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Write Android signing config
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/${{ inputs.app }}/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      # The Web Worker that fits run on (Wasm and JS), copied in with web/.
      - name: Build the fit worker
        if: matrix.target == 'web' && hashFiles(format('apps/{0}/tool/build_worker.sh', inputs.app)) != ''
        run: apps/${{ inputs.app }}/tool/build_worker.sh

      - name: Build
        working-directory: apps/${{ inputs.app }}
        run: |
          case "${{ matrix.target }}" in
            android) flutter build apk --release --split-per-abi ;;
            web)     flutter build web --release --wasm -O4 --no-source-maps --strip-wasm --base-href / ;;
            *)       flutter build "${{ matrix.target }}" --release ;;
          esac

      - name: Package
        working-directory: apps/${{ inputs.app }}/build
        run: |
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          case "${{ matrix.target }}" in
            linux)
              tar -C linux/x64/release/bundle -czf "$DIST/$NAME-x64.tar.gz" .
              ;;
            windows)
              (cd windows/x64/runner/Release && 7z a -tzip "$DIST/$NAME-x64.zip" .)
              ;;
            macos)
              # Unsigned: users need to right-click → Open the first time.
              BUNDLE="$(find macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
              ditto -c -k --keepParent "$BUNDLE" "$DIST/$NAME.zip"
              ;;
            android)
              for apk in app/outputs/flutter-apk/app-*-release.apk; do
                abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
                cp "$apk" "$DIST/$NAME-$abi.apk"
              done
              ;;
            web)
              (cd web && zip -qr "$DIST/$NAME.zip" .)
              ;;
          esac
          ls -la "$DIST"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
