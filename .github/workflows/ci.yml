name: CI

on:
  # Not tags: release.yml reuses (or starts) the run of the tagged commit.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Analyze and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Melos scripts call `melos` themselves, so it must be on PATH.
      - run: dart pub global activate melos ^8.2.2
      - run: melos run lint:all --no-select

  test:
    name: Tests (VM and Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Melos scripts call `melos` themselves, so it must be on PATH.
      - run: dart pub global activate melos ^8.2.2
      # Engine (incl. the pyhgf parity suites), widgets and playground.
      - run: melos run test --no-select

  web:
    name: Parity and Web Workers on dart2js and dart2wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Wasm GC needs a recent Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: flutter pub get
      # Melos scripts call `melos` themselves, so it must be on PATH.
      - run: dart pub global activate melos ^8.2.2
      - name: Configure Chrome Sandbox Bypass Wrapper
        run: |
          echo '#!/bin/bash' > ./chrome_ci_wrapper.sh
          echo 'exec "${{ steps.chrome.outputs.chrome-path }}" --no-sandbox "$@"' >> ./chrome_ci_wrapper.sh
          chmod +x ./chrome_ci_wrapper.sh
      - run: melos run test:web --no-select
        env:
          CHROME_EXECUTABLE: "${{ github.workspace }}/chrome_ci_wrapper.sh"
      - run: melos run test:wasm-release --no-select
      - run: melos run test:web-workers --no-select
        env:
          CHROME_EXECUTABLE: "${{ github.workspace }}/chrome_ci_wrapper.sh"

  gpu-web:
    name: GPU kernels on WebGPU (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # New (2026-11-18), not yet seen green on a runner: it doesn't block
    # CI (or the Pages deploy) until it has. Remove once it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: flutter pub get
      - name: Configure Chrome Sandbox Bypass Wrapper
        run: |
          echo '#!/bin/bash' > ./chrome_ci_wrapper.sh
          echo 'exec "${{ steps.chrome.outputs.chrome-path }}" --no-sandbox "$@"' >> ./chrome_ci_wrapper.sh
          chmod +x ./chrome_ci_wrapper.sh
      # test:gpu's web half: the kernels against the f64 engines on every
      # fixture. The runner has no GPU, so Chrome's WebGPU runs on
      # SwiftShader (CHROME_EXECUTABLE overrides chrome-gpu's executable).
      # The tests skip without an adapter, so a skip fails the step.
      - name: Kernels on Chrome's WebGPU (dart2wasm)
        working-directory: packages/hgf_gpu
        shell: bash
        run: |
          set -o pipefail
          dart test -p chrome-gpu -c dart2wasm --tags gpu 2>&1 | tee "$RUNNER_TEMP/gpu.log"
          if grep -q 'No WebGPU adapter' "$RUNNER_TEMP/gpu.log"; then
            echo '::error::Chrome offered no WebGPU adapter'
            exit 1
          fi
        env:
          CHROME_EXECUTABLE: "${{ github.workspace }}/chrome_ci_wrapper.sh"
