name: Deploy playground to GitHub Pages

# Deploys only commits on main that passed CI (or on a manual run).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - id: pages
        uses: actions/configure-pages@v6
      # Wasm (skwasm) with a dart2js fallback for browsers without Wasm GC.
      # -O4: the fastest dart2wasm output (see ROADMAP W2); symbols stripped,
      # no source maps.
      - name: Build (Wasm, -O4)
        working-directory: apps/hgf_playground
        run: >-
          flutter build web --release --wasm -O4
          --no-source-maps --strip-wasm
          --base-href "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/hgf_playground/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
