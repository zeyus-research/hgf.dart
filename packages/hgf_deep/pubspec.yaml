name: hgf_deep
description: >-
  Deep HGF networks (layers of volatile, binary and categorical nodes with
  learned weights) in pure Dart: a port of pyhgf's vectorised DeepNetwork,
  numerically checked against it.
version: 0.1.0-dev.1
publish_to: none
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart
issue_tracker: https://github.com/NexusDynamic/hgf.dart/issues

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hgf: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
