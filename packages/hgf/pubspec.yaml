name: hgf
description: >-
  Hierarchical Gaussian Filter (HGF) and generalised predictive-coding networks
  in pure Dart. A port of the pyhgf nodalised engine, numerically checked
  against pyhgf. Runs on the Dart VM, AOT and the web.
version: 0.1.0-dev.1
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart
issue_tracker: https://github.com/NexusDynamic/hgf.dart/issues
topics:
  - neuroscience
  - bayesian
  - predictive-coding
  - computational-psychiatry
  - filtering

resolution: workspace

environment:
  sdk: ^3.10.0

dev_dependencies:
  lints: ^6.0.0
  stream_channel: ^2.1.4
  test: ^1.28.0
