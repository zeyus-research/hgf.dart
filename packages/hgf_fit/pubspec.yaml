name: hgf_fit
description: >-
  Parameter estimation for hgf networks: priors, response models, batched
  objectives with finite-difference gradients, and MAP optimisers (L-BFGS,
  Nelder-Mead) that fit many subjects in one batched pass.
version: 0.1.0-dev.1
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart
issue_tracker: https://github.com/NexusDynamic/hgf.dart/issues
topics:
  - neuroscience
  - bayesian
  - computational-psychiatry
  - optimization

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  hgf: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
