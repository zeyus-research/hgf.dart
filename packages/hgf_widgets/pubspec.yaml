name: hgf_widgets
description: >-
  Flutter widgets for hgf networks: belief trajectory plots (fast enough for
  live re-runs over thousands of trials) and a network graph view.
version: 0.1.0-dev.1
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart
issue_tracker: https://github.com/NexusDynamic/hgf.dart/issues
topics:
  - neuroscience
  - bayesian
  - predictive-coding
  - visualization

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  hgf: ^0.1.0-dev.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
