name: hgf_metapackage
publish_to: none
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart

environment:
  sdk: ^3.10.0

workspace:
  - packages/hgf
  - packages/hgf_fit
  - packages/hgf_deep
  - packages/hgf_gpu
  - packages/hgf_widgets
  - apps/hgf_playground

dev_dependencies:
  melos: ^8.2.2

melos:
  packages:
    - packages/**
    - apps/**
  command:
    version:
      branch: main
  scripts:
    lint:all:
      steps:
        - analyze
        - format-check
      description: Run all static analysis checks.
    analyze:
      exec: dart analyze . --fatal-infos
      description: Run `dart analyze` for all packages.
    format:
      exec: dart format .
      description: Run `dart format` for all packages.
    format-check:
      exec: dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.
    test:dart:
      # Exit code 79 is "no tests ran" (all of a package's tests excluded by tag).
      # `\$` because melos runs this through a second (outer) shell.
      exec:
        command: dart test --exclude-tags "performance,benchmark" 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: Run `dart test` for pure-Dart packages (no performance/benchmark tags).
    test:parity:
      exec:
        command: dart test --tags parity 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: Run the pyhgf parity suites against the JSON fixtures.
    test:web:
      # Chrome is found via CHROME_EXECUTABLE (e.g. /usr/bin/chromium).
      exec:
        command: >-
          dart test -p node,chrome --tags parity 2>&1 &&
          dart test -p chrome -c dart2wasm --tags parity 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: >-
        Run the parity suites on the web compilers: dart2js (Node, Chrome) and
        dart2wasm (Chrome). See also test:wasm-release (-O4).
    test:web-workers:
      # Compiles the test worker with both web compilers, then runs FitWorkers
      # on Web Workers from a dart2js and a dart2wasm page (Chrome).
      exec:
        command: >-
          dart compile js -O2 test/web/fit_worker.dart -o test/web/fit_worker.js &&
          dart compile wasm -O2 test/web/fit_worker.dart -o test/web/fit_worker.wasm &&
          dart test -p chrome --tags web-workers 2>&1 &&
          dart test -p chrome -c dart2wasm --tags web-workers 2>&1
        concurrency: 1
      packageFilters:
        fileExists: test/web/fit_worker.dart
      description: >-
        FitWorkers on Web Workers (JS and Wasm workers, dart2js and dart2wasm
        pages): results bit-identical to the main thread.
    test:wasm-release:
      # `dart test -c dart2wasm` can't pass -O4, so the parity suite is also
      # compiled as a standalone app with the release flags and run under Node.
      exec:
        command: >-
          dart compile wasm -O4 tool/parity_check.dart -o .dart_tool/parity_check.wasm &&
          node ../../tool/web/run_wasm.mjs .dart_tool/parity_check.wasm
        concurrency: 1
      packageFilters:
        fileExists: tool/parity_check.dart
      description: Run the parity suite on a dart2wasm -O4 (release) build under Node.
    test:gpu-firefox:
      # Firefox's WebGPU on the machine's GPU (headless; tool/firefox_webgpu.sh
      # adds the WebGPU prefs to package:test's profile). Linux and macOS.
      exec:
        command: >-
          FIREFOX_EXECUTABLE=$MELOS_PACKAGE_PATH/tool/firefox_webgpu.sh
          dart test -p firefox -c dart2wasm --tags gpu 2>&1
        concurrency: 1
      packageFilters:
        fileExists: tool/firefox_webgpu.sh
      description: The GPU parity suites (test:gpu's web half) in Firefox.
    test:gpu:
      # Native: wgpu-native through dart:ffi (skips without the library).
      # Web: Chromium's WebGPU, on SwiftShader (dart test passes --disable-gpu).
      exec:
        command: >-
          dart test --tags gpu test/native_parity_test.dart test/native_fit_test.dart test/native_deep_test.dart 2>&1 &&
          dart test -p chrome-gpu -c dart2wasm --tags gpu 2>&1
        concurrency: 1
      packageFilters:
        fileExists: test/gpu_parity_test.dart
      description: >-
        The GPU kernels (f32) against the f64 engine on every parity fixture
        (hgf and hgf_deep), on wgpu-native and on Chromium's WebGPU.
    test:flutter:
      exec:
        command: flutter test --exclude-tags performance
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: true
      description: Run `flutter test` for the Flutter packages and apps (no performance tags).
    test:
      steps:
        - melos run test:dart --no-select
        - melos run test:flutter --no-select
      description: Run all default tests.
    build:worker:
      run: apps/hgf_playground/tool/build_worker.sh
      description: >-
        Compile the playground's fit worker (Wasm and JS) into its web/
        folder; `flutter run -d chrome` and `flutter build web` serve it.
    build:playground:
      run: >-
        apps/hgf_playground/tool/build_worker.sh &&
        cd apps/hgf_playground && flutter build web --wasm -O4
      description: Build the playground for the web (Wasm, the primary target), with its fit host and fit workers.
    bench:playground:
      run: >-
        cd apps/hgf_playground && flutter build web --wasm -O4 &&
        cd ../.. && uv run --with playwright python -I tool/web/playground_bench.py
      description: >-
        Frame times of the playground's Wasm build while a slider re-filters
        300, 1000 and 10000 trials every frame (headless Chromium).
    bench:playground-fit:
      run: >-
        melos run build:playground &&
        uv run --with playwright python -I tool/web/playground_fit_bench.py
      description: >-
        Fits in the playground's Wasm build, on Web Workers and on the main
        thread: wall time, frame intervals while fitting, and recovery of a
        simulated agent's parameters (headless Chromium).
    fixtures:
      run: cd tool/parity && uv run python gen_fixtures.py
      description: Regenerate the pyhgf parity fixtures (needs ../pyhgf and uv).
    fixtures:deep:
      run: cd tool/parity && uv run python gen_deep_fixtures.py
      description: >-
        Regenerate hgf_deep's DeepNetwork fixtures (pyhgf JAX float64, with
        rshgf's float32 deviation for information).
    bench:deep:
      run: >-
        cd packages/hgf_deep &&
        dart compile exe benchmark/bin/deep_benchmark.dart -o .dart_tool/deep_bench &&
        taskset -c 0 .dart_tool/deep_bench --out .dart_tool/deep_problems.json &&
        cd ../../tool/parity &&
        taskset -c 0 uv run python bench_deep.py ../../packages/hgf_deep/.dart_tool/deep_problems.json &&
        taskset -c 0 uv run python bench_deep.py ../../packages/hgf_deep/.dart_tool/deep_problems.json --f32
      description: >-
        DeepNetwork fit (sequential), batch_update and predict on three
        tanh networks, one core: hgf_deep against pyhgf JAX (float64 and
        float32) and rshgf. Linux (taskset).
    bench:fit:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/fit_benchmark.dart -o .dart_tool/fit_benchmark &&
        .dart_tool/fit_benchmark --out .dart_tool/fit_problem.json &&
        cd ../../tool/parity &&
        uv run python fit_map_jax.py ../../packages/hgf_fit/.dart_tool/fit_problem.json
      description: >-
        MAP fitting of pyhgf's parameter-recovery problem: hgf_fit (AOT) against
        pyhgf + JAX gradients + SciPy L-BFGS-B. Pass agents with
        `--agents N` by running the steps by hand.
    bench:nuts:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/fit_benchmark.dart -o .dart_tool/fit_benchmark &&
        taskset -c 0 .dart_tool/fit_benchmark --repeat 1 --nuts --out .dart_tool/nuts_problem.json &&
        cd ../../tool/parity &&
        taskset -c 0 uv run --with numpyro python fit_nuts_jax.py ../../packages/hgf_fit/.dart_tool/nuts_problem.json --backend numpyro &&
        taskset -c 0 uv run python fit_nuts_jax.py ../../packages/hgf_fit/.dart_tool/nuts_problem.json --backend pymc
      description: >-
        NUTS on pyhgf's parameter-recovery problem (20 agents, 4 chains,
        1000 + 1000), one core: hgf_fit's sampleNuts against PyMC (the
        notebook's wrap_jax route) and NumPyro, with ESS/s and agreement of
        the posterior means. Takes about 8 minutes; Linux (taskset).
    bench:hier:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/hierarchical_benchmark.dart -o .dart_tool/hier_benchmark &&
        taskset -c 0 .dart_tool/hier_benchmark --centered --out .dart_tool/hier_problem.json &&
        cd ../../tool/parity &&
        taskset -c 0 uv run --with numpyro python fit_hier_jax.py ../../packages/hgf_fit/.dart_tool/hier_problem.json --backend numpyro &&
        taskset -c 0 uv run python fit_hier_jax.py ../../packages/hgf_fit/.dart_tool/hier_problem.json --backend pymc
      description: >-
        Hierarchical model of pyhgf's multilevel notebook (10 agents, ω₂ and
        β pooled, 4 chains, 1000 + 1000, centred), one core: hgf_fit's
        empirical Bayes and sampleHierarchical against NumPyro and PyMC (the
        notebook's route). Linux (taskset).
    bench:parallel:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/parallel_benchmark.dart -o .dart_tool/parallel_benchmark &&
        .dart_tool/parallel_benchmark --agents 20,200 --workers 2,4,8 --draws 150
      description: >-
        FitWorkers (isolate-parallel passes) against the single-isolate
        functions: MAP, Laplace, NUTS, hierarchical NUTS and empirical Bayes
        on pyhgf's parameter-recovery problem; checks the results are
        bit-identical. Takes about 15 minutes.
    bench:web-parallel:
      run: >-
        cd packages/hgf_fit &&
        mkdir -p .dart_tool/web_bench &&
        command cp -f benchmark/web/index.html data/binary_input.txt .dart_tool/web_bench/ &&
        dart compile wasm -O4 benchmark/web/web_parallel_benchmark.dart -o .dart_tool/web_bench/bench.wasm &&
        dart compile wasm -O4 benchmark/web/fit_worker.dart -o .dart_tool/web_bench/fit_worker.wasm &&
        dart compile js -O2 benchmark/web/web_parallel_benchmark.dart -o .dart_tool/web_bench/bench.js &&
        dart compile js -O2 benchmark/web/fit_worker.dart -o .dart_tool/web_bench/fit_worker.js &&
        cd ../.. &&
        uv run --with playwright python -I tool/web/fit_workers_bench.py packages/hgf_fit/.dart_tool/web_bench
      description: >-
        FitWorkers on Web Workers against the page's main thread in headless
        Chromium (dart2wasm -O4 and dart2js -O2): bench:parallel's jobs.
        Takes about 10 minutes.
    bench:gpu-web:
      # Headless Chromium with WebGPU on Vulkan (the machine's GPU).
      exec:
        command: >-
          mkdir -p .dart_tool/gpu_web &&
          command cp -f benchmark/web/index.html ../hgf/benchmark/data/inputs.json .dart_tool/gpu_web/ &&
          dart compile wasm -O4 benchmark/web/gpu_bench.dart -o .dart_tool/gpu_web/bench.wasm &&
          uv run --with playwright python -I tool/gpu_bench.py .dart_tool/gpu_web
        concurrency: 1
      packageFilters:
        fileExists: tool/gpu_bench.py
      description: >-
        Phase 7 probe on WebGPU (dart2wasm -O4 page): f32 accuracy against
        BatchNetwork, then time against batch size, as JSON lines.
    bench:gpu-fit:
      # hgf_fit's MAP and NUTS with their passes on wgpu-native, against a
      # FitWorkers pool.
      exec:
        command: >-
          dart compile exe benchmark/bin/fit_gpu.dart -o .dart_tool/fit_gpu &&
          .dart_tool/fit_gpu --agents 20,200,2000 --runners pool,gpu
        concurrency: 1
      packageFilters:
        fileExists: benchmark/bin/fit_gpu.dart
      description: >-
        GpuFitter vs FitWorkers on pyhgf's parameter-recovery problem.
    bench:gpu-deep:
      # hgf_deep's DeepNetwork on wgpu-native vs the f64 CPU engine (one core).
      exec:
        command: >-
          dart compile exe benchmark/bin/deep_gpu.dart -o .dart_tool/deep_gpu &&
          taskset -c 0 .dart_tool/deep_gpu --batches 256,1024,4096
        concurrency: 1
      packageFilters:
        fileExists: benchmark/bin/deep_gpu.dart
      description: >-
        GpuDeepNetwork batchUpdate / trainEpoch / predict vs DeepNetwork on
        hgf_deep's small, medium and wide benchmark networks.
    bench:gpu-ensemble:
      # hgf_deep's sequential fit for many networks at once on wgpu-native
      # (GpuDeepEnsemble) vs DeepNetwork.fit on one core (~1 min).
      exec:
        command: >-
          dart compile exe benchmark/bin/deep_ensemble.dart -o .dart_tool/deep_ensemble &&
          taskset -c 0 .dart_tool/deep_ensemble --members 1,16,256,1024,4096
        concurrency: 1
      packageFilters:
        fileExists: benchmark/bin/deep_ensemble.dart
      description: >-
        GpuDeepEnsemble.fit vs DeepNetwork.fit by member count, on the small,
        medium and wide benchmark networks (wide skips what the device can't
        hold).
    bench:gpu-native:
      exec:
        command: >-
          dart compile exe benchmark/bin/gpu_native.dart -o .dart_tool/gpu_native &&
          .dart_tool/gpu_native
        concurrency: 1
      packageFilters:
        fileExists: benchmark/bin/gpu_native.dart
      description: >-
        Phase 7 probe on wgpu-native (AOT, dart:ffi); needs libwgpu_native
        (installed, or tool/fetch_wgpu.sh + WGPU_LIB).
    bench:
      run: dart run tool/bench_compare.dart --rust
      description: >-
        Run the same scenarios on Dart (AOT, JIT, JS, Wasm), pyhgf (JAX and
        rshgf via Python) and rshgf linked natively; print a comparison table
        and write docs/benchmark_results.md.
