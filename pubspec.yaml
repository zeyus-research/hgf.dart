name: hgf_metapackage
publish_to: none
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/hgf.dart

environment:
  sdk: ^3.10.0

workspace:
  - packages/hgf
  - packages/hgf_fit
  - packages/hgf_widgets
  - apps/hgf_playground

dev_dependencies:
  melos: ^8.2.2

melos:
  packages:
    - packages/**
    - apps/**
  command:
    version:
      branch: main
  scripts:
    lint:all:
      steps:
        - analyze
        - format-check
      description: Run all static analysis checks.
    analyze:
      exec: dart analyze . --fatal-infos
      description: Run `dart analyze` for all packages.
    format:
      exec: dart format .
      description: Run `dart format` for all packages.
    format-check:
      exec: dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.
    test:dart:
      # Exit code 79 is "no tests ran" (all of a package's tests excluded by tag).
      # `\$` because melos runs this through a second (outer) shell.
      exec:
        command: dart test --exclude-tags "performance,benchmark" 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: Run `dart test` for pure-Dart packages (no performance/benchmark tags).
    test:parity:
      exec:
        command: dart test --tags parity 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: Run the pyhgf parity suites against the JSON fixtures.
    test:web:
      # Chrome is found via CHROME_EXECUTABLE (e.g. /usr/bin/chromium).
      exec:
        command: >-
          dart test -p node,chrome --tags parity 2>&1 &&
          dart test -p chrome -c dart2wasm --tags parity 2>&1 || [ \$? -eq 79 ]
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: >-
        Run the parity suites on the web compilers: dart2js (Node, Chrome) and
        dart2wasm (Chrome). See also test:wasm-release (-O4).
    test:wasm-release:
      # `dart test -c dart2wasm` can't pass -O4, so the parity suite is also
      # compiled as a standalone app with the release flags and run under Node.
      exec:
        command: >-
          dart compile wasm -O4 tool/parity_check.dart -o .dart_tool/parity_check.wasm &&
          node ../../tool/web/run_wasm.mjs .dart_tool/parity_check.wasm
        concurrency: 1
      packageFilters:
        fileExists: tool/parity_check.dart
      description: Run the parity suite on a dart2wasm -O4 (release) build under Node.
    test:flutter:
      exec:
        command: flutter test --exclude-tags performance
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: true
      description: Run `flutter test` for the Flutter packages and apps (no performance tags).
    test:
      steps:
        - melos run test:dart --no-select
        - melos run test:flutter --no-select
      description: Run all default tests.
    build:playground:
      run: cd apps/hgf_playground && flutter build web --wasm -O4
      description: Build the playground for the web (Wasm, the primary target).
    bench:playground:
      run: >-
        cd apps/hgf_playground && flutter build web --wasm -O4 &&
        cd ../.. && uv run --with playwright python -I tool/web/playground_bench.py
      description: >-
        Frame times of the playground's Wasm build while a slider re-filters
        300, 1000 and 10000 trials every frame (headless Chromium).
    fixtures:
      run: cd tool/parity && uv run python gen_fixtures.py
      description: Regenerate the pyhgf parity fixtures (needs ../pyhgf and uv).
    bench:fit:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/fit_benchmark.dart -o .dart_tool/fit_benchmark &&
        .dart_tool/fit_benchmark --out .dart_tool/fit_problem.json &&
        cd ../../tool/parity &&
        uv run python fit_map_jax.py ../../packages/hgf_fit/.dart_tool/fit_problem.json
      description: >-
        MAP fitting of pyhgf's parameter-recovery problem: hgf_fit (AOT) against
        pyhgf + JAX gradients + SciPy L-BFGS-B. Pass agents with
        `--agents N` by running the steps by hand.
    bench:nuts:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/fit_benchmark.dart -o .dart_tool/fit_benchmark &&
        taskset -c 0 .dart_tool/fit_benchmark --repeat 1 --nuts --out .dart_tool/nuts_problem.json &&
        cd ../../tool/parity &&
        taskset -c 0 uv run --with numpyro python fit_nuts_jax.py ../../packages/hgf_fit/.dart_tool/nuts_problem.json --backend numpyro &&
        taskset -c 0 uv run python fit_nuts_jax.py ../../packages/hgf_fit/.dart_tool/nuts_problem.json --backend pymc
      description: >-
        NUTS on pyhgf's parameter-recovery problem (20 agents, 4 chains,
        1000 + 1000), one core: hgf_fit's sampleNuts against PyMC (the
        notebook's wrap_jax route) and NumPyro, with ESS/s and agreement of
        the posterior means. Takes about 8 minutes; Linux (taskset).
    bench:hier:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/hierarchical_benchmark.dart -o .dart_tool/hier_benchmark &&
        taskset -c 0 .dart_tool/hier_benchmark --centered --out .dart_tool/hier_problem.json &&
        cd ../../tool/parity &&
        taskset -c 0 uv run --with numpyro python fit_hier_jax.py ../../packages/hgf_fit/.dart_tool/hier_problem.json --backend numpyro &&
        taskset -c 0 uv run python fit_hier_jax.py ../../packages/hgf_fit/.dart_tool/hier_problem.json --backend pymc
      description: >-
        Hierarchical model of pyhgf's multilevel notebook (10 agents, ω₂ and
        β pooled, 4 chains, 1000 + 1000, centred), one core: hgf_fit's
        empirical Bayes and sampleHierarchical against NumPyro and PyMC (the
        notebook's route). Linux (taskset).
    bench:parallel:
      run: >-
        cd packages/hgf_fit &&
        dart compile exe benchmark/bin/parallel_benchmark.dart -o .dart_tool/parallel_benchmark &&
        .dart_tool/parallel_benchmark --agents 20,200 --workers 2,4,8 --draws 150
      description: >-
        FitWorkers (isolate-parallel passes) against the single-isolate
        functions: MAP, Laplace, NUTS, hierarchical NUTS and empirical Bayes
        on pyhgf's parameter-recovery problem; checks the results are
        bit-identical. Takes about 15 minutes.
    bench:
      run: dart run tool/bench_compare.dart --rust
      description: >-
        Run the same scenarios on Dart (AOT, JIT, JS, Wasm), pyhgf (JAX and
        rshgf via Python) and rshgf linked natively; print a comparison table
        and write docs/benchmark_results.md.
